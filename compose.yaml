services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: connector
      POSTGRES_USER: apaleo_connector
      POSTGRES_PASSWORD: apaleo_connector
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaleo_connector"]
      interval: 2s
      timeout: 5s
      retries: 15
