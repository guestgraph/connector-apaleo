info:
  title: GuestGraph Apaleo connector — operations
  version: 0.2.0
  description: |-
    What an operator and Apaleo can call on the connector. Apaleo delivers events to the webhook endpoint; an operator reads the status, starts a full sync or a reconciliation, and follows a run. Everything else the connector does, it does on its own schedule.

    Removing and restoring one connection's webhook subscription. The connector creates a subscription for every configured connection when it starts and confirms it during every reconciliation; these two paths are how an operator takes one away before a teardown and puts it back without a restart.
  license:
    name: Apache-2.0
