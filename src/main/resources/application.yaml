spring:
  application:
    name: connector-apaleo
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/connector}
    username: ${DATABASE_USERNAME:apaleo_connector}
    password: ${DATABASE_PASSWORD:apaleo_connector}
    hikari:
      # One schema, one role (data-model "One schema, one role"): every pooled connection opens
      # with this search path, so the connector touches nothing outside DATABASE_SCHEMA whether
      # the database is the engine's or its own. The same shape the engine uses (its slice 6).
      schema: ${DATABASE_SCHEMA:apaleo_connector}
  flyway:
    enabled: true
    default-schema: ${DATABASE_SCHEMA:apaleo_connector}
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: start_only

server:
  port: 8081

connector:
  apaleo:
    # The three hosts a connection's client talks to; tests point them at a stub.
    identity-url: https://identity.apaleo.com
    api-url: https://api.apaleo.com
    webhook-url: https://webhook.apaleo.com

management:
  endpoints:
    web:
      exposure:
        include: health
