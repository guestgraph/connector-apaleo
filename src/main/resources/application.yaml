spring:
  application:
    name: connector-apaleo
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/connector}
    username: ${DATABASE_USERNAME:apaleo_connector}
    password: ${DATABASE_PASSWORD:apaleo_connector}
    hikari:
      # One schema, one role (data-model "One schema, one role"): every pooled connection opens
      # with this search path, so the connector touches nothing outside DATABASE_SCHEMA whether
      # the database is the engine's or its own. The same shape the engine uses (its slice 6).
      schema: ${DATABASE_SCHEMA:apaleo_connector}
  flyway:
    enabled: true
    default-schema: ${DATABASE_SCHEMA:apaleo_connector}
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: start_only

server:
  port: 8081

# The instance's configuration (data-model "Configuration"). Connections and their secrets live
# in the file connections-file names, never here and never in the database.
connector:
  public-url: ${CONNECTOR_PUBLIC_URL:}
  ops-token: ${CONNECTOR_OPS_TOKEN:}
  connections-file: ${CONNECTOR_CONNECTIONS_FILE:}
  engine-source-system: ${ENGINE_SOURCE_SYSTEM:apaleo}
  resync-after-gap: ${RESYNC_AFTER_GAP:PT24H}
  refresh-cron: ${REFRESH_CRON:0 0 3 * * *}
  # A connection with no sync point yet gets a full sync at start; tests turn this off.
  sync-on-boot: ${SYNC_ON_BOOT:true}
  reconcile:
    interval: ${RECONCILE_INTERVAL:PT15M}
    overlap: ${RECONCILE_OVERLAP:PT1H}
  events:
    # How often stored deliveries are drained: a change reaches the engine within this and one fetch.
    poll-interval: ${EVENT_POLL_INTERVAL:PT10S}
  apaleo:
    # The three hosts a connection's client talks to; tests point them at a stub.
    identity-url: https://identity.apaleo.com
    api-url: https://api.apaleo.com
    webhook-url: https://webhook.apaleo.com
    # The event types that can carry a change of person (spec FR-007); a sandbox session may widen it.
    event-types: ${APALEO_EVENT_TYPES:reservation/created,reservation/changed,reservation/amended,reservation/picked-up-from-block,reservation/checked-in,booking/created,booking/changed}
    backoff-initial: PT1S
    backoff-max: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health
